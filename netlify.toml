[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are public by design (inlined into the client bundle).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_APP_TIMEZONE,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
