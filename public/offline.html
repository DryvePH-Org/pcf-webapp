<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · Petty Cash Fund</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #ffffff;
        color: #171717;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0a0a0a;
          color: #f5f5f5;
        }
      }
      .card {
        max-width: 360px;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 14px;
        background: #171717;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (prefers-color-scheme: dark) {
        .icon {
          background: #f5f5f5;
          color: #171717;
        }
      }
      .icon svg {
        width: 28px;
        height: 28px;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.925rem;
        line-height: 1.5;
        color: #737373;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 9999px;
        padding: 10px 20px;
        font-size: 0.925rem;
        font-weight: 600;
        background: #171717;
        color: #ffffff;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #f5f5f5;
          color: #171717;
        }
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 8.82a15 15 0 0 1 20 0" />
          <path d="M5 12.86a10 10 0 0 1 14 0" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        Petty Cash Fund needs a connection to load your vouchers and fund
        balance. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
