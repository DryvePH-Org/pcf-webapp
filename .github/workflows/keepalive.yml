name: Keep-alive

# Supabase pauses free projects after about a week without activity. Hitting
# /api/health runs a real query against the database, which counts as activity.
on:
  schedule:
    - cron: "0 2 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Call the health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "${APP_URL%/}/api/health"
